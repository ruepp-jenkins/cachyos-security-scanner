<!-- Renders ```mermaid code blocks as diagrams (Jekyll shows them as plain code otherwise). -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  document.querySelectorAll("pre > code.language-mermaid, div.language-mermaid pre code").forEach(function (code) {
    var box = document.createElement("div");
    box.className = "mermaid";
    box.textContent = code.textContent;
    var target = code.closest("div.language-mermaid") || code.parentElement;
    target.replaceWith(box);
  });
  mermaid.initialize({ startOnLoad: false, theme: "dark" });
  mermaid.run({ querySelector: ".mermaid" });
</script>

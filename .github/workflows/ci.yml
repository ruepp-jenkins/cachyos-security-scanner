name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Qt libraries and PySide6 for the headless GUI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
          python -m pip install -q PySide6-Essentials
      - run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m cachy_sec.signedlist validate lists/*.json
